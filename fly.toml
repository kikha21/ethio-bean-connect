# fly.toml app configuration file generated for ethio-bean-connect on 2026-09-11T23:41:53+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ethio-bean-connect'
primary_region = 'iad'

[build]
[env]
  EBC_DATA_DIR = '/data'
  PORT = '8080'

[[mounts]]
  source = 'ethiobean_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 40

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
